<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site Moved</title>
    <meta
      name="description"
      content="This GitHub Pages site now points visitors to the new blog location."
    />
    <meta
      http-equiv="refresh"
      content="0; url=https://veganmosfet.codeberg.page/"
    />
    <script>
      // Keep fallback content visible while redirecting instantly when JS is enabled.
      window.location.replace("https://veganmosfet.codeberg.page/");
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7fb;
        --card: #ffffff;
        --text: #1b1f2a;
        --muted: #4a5160;
        --link: #0b57d0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 15% 10%, #ffffff 0%, transparent 35%),
          radial-gradient(circle at 90% 90%, #e9eefb 0%, transparent 30%),
          var(--bg);
        color: var(--text);
        padding: 24px;
      }

      main {
        width: min(720px, 100%);
        background: var(--card);
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 12px 30px rgba(23, 33, 58, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 1rem + 2.2vw, 2.6rem);
        line-height: 1.1;
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.6;
      }

      a {
        color: var(--link);
      }

      .cta {
        display: inline-block;
        margin-top: 10px;
        font-weight: 600;
        text-underline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Blog has moved</h1>
      <p>
        Redirecting you to the new blog location now.
      </p>
      <p>
        <a class="cta" href="https://veganmosfet.codeberg.page/" rel="me">
          https://veganmosfet.codeberg.page/
        </a>
      </p>
      <noscript>
        <p>JavaScript is disabled. Use the link above to continue.</p>
      </noscript>
    </main>
  </body>
</html>
